name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AQUA_VERSION: v2.65.2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
      - run: task tidy-check
      - run: golangci-lint fmt --diff ./...
      - run: task lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Fail instead of skipping when swtpm or dbus-daemon is missing.
      BIO_REQUIRE_LINUX_DEPS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
      # Exercise the real Keychain code (items are created and deleted).
      BIO_KEYCHAIN_TESTS: ${{ matrix.os == 'macos-latest' && '1' || '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
      - name: Install swtpm and dbus-daemon
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swtpm dbus-daemon
      - run: task test
      - name: Coverage summary
        shell: bash
        run: |
          echo "### Coverage on ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - freebsd/amd64 # the unsupported-platform build
          - windows/386
          - windows/arm64
          - darwin/amd64
          - linux/arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Vet and compile tests
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go vet ./...
          go test -c -o /dev/null .
        env:
          TARGET: ${{ matrix.target }}

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
      - run: task fuzz FUZZTIME=20s

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: ${{ env.AQUA_VERSION }}
      - run: task vuln
